services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobilefrost_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mobilefrost_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - "/dev:/dev"
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
    group_add:
      - keep-groups
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=mobilefrost_user
      - DB_PASSWORD=secretpassword
      - DB_NAME=mobilefrost_db

volumes:
  pgdata: