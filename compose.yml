services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobilefrost_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mobilefrost_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - "/dev:/dev"
    group_add:
      - keep-groups
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=mobilefrost_user
      - DB_PASSWORD=secretpassword
      - DB_NAME=mobilefrost_db

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "2"
      - --threads
      - "2"
      - mobilefrost.dashboard:create_app()
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=mobilefrost_user
      - DB_PASSWORD=secretpassword
      - DB_NAME=mobilefrost_db

volumes:
  pgdata: