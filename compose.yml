services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobilefrost_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: mobilefrost_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  controller:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - mosquitto
    volumes:
      - "/dev:/dev"
    group_add:
      - keep-groups
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=mobilefrost_user
      - DB_PASSWORD=secretpassword
      - DB_NAME=mobilefrost_db
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "2"
      - --threads
      - "2"
      - mobilefrost.dashboard:create_app()
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=mobilefrost_user
      - DB_PASSWORD=secretpassword
      - DB_NAME=mobilefrost_db

  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - nodered_data:/data

volumes:
  pgdata:
  nodered_data: